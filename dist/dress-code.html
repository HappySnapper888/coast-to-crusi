<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Join C & K for their wedding at Butterfly Blu on 1 May 2027.">
<title>Dress Inspo · Coast to Crusi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap');
:root{--ink:#243c4b;--muted:#4b6472;--paper:#fbfaf6;--blue:#e4edf2;--line:#bdccd3;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "DM Sans",system-ui,sans-serif}
a{color:inherit} a:focus-visible,summary:focus-visible{outline:2px solid currentColor;outline-offset:5px}
header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(6vw,22px)}
.mark{text-decoration:none;font:36px/1 var(--serif)}
nav{display:flex;gap:clamp(15px,4vw,48px)}
nav a,.label,.button{font-size:11px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;text-decoration:none}
nav a:hover{text-decoration:underline;text-underline-offset:5px}
.hero{min-height:clamp(545px,76svh,820px);display:grid;place-items:center;text-align:center;color:white;padding:72px 22px;background:linear-gradient(0deg,#162a3870,#22394930 68%,#22394940),url("coast.jpg") center 54%/cover,#51758a}
.hero-inner{max-width:1000px;text-shadow:0 2px 24px #172c49a6}
h1,h2,h3,p{margin:0}
h1{font:clamp(78px,12vw,172px)/.77 var(--serif);margin:26px 0 32px;letter-spacing:-.035em}
h1 em{display:block;font-weight:400}
.hero-date{font-size:13px;letter-spacing:.23em;text-transform:uppercase}
.button{display:inline-flex;justify-content:center;align-items:center;min-height:46px;border:1px solid currentColor;padding:0 23px;margin-top:28px;transition:background .2s,color .2s}
.hero .button:hover{background:white;color:var(--ink);text-shadow:none}
.intro{text-align:center;padding:clamp(70px,10vw,135px) 22px}
.label{color:var(--muted)}
.hero .label{color:white}
h2{font:clamp(53px,8vw,100px)/.93 var(--serif);letter-spacing:-.025em;margin:18px 0 24px}
.intro p:last-child{max-width:470px;margin:auto}
.details{background:var(--blue);padding:clamp(65px,9vw,115px) max(6vw,22px)}
.detail-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,7vw,100px);max-width:1030px;margin:auto}
dl{margin:0}
dl div{padding:17px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:110px 1fr;gap:15px}
dl div:last-child{border-bottom:1px solid var(--line)}
dt{font-weight:600} dd{margin:0}
.travel{padding:clamp(65px,9vw,115px) max(6vw,22px);max-width:1120px;margin:auto}
details{border-top:1px solid var(--line);padding:15px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600}
details p{margin:9px 0 2px 17px;color:var(--muted)}
footer{text-align:center;padding:48px 22px;background:#263f4e;color:var(--paper)}
footer strong{display:block;font:italic 54px/.95 var(--serif);margin-bottom:13px}
footer p{font-size:12px;letter-spacing:.14em}
@media(max-width:620px){header{height:64px} .mark{font-size:30px} nav a{font-size:10px;letter-spacing:.11em}.detail-grid{grid-template-columns:1fr;gap:15px}.hero{background-position:center,56% center}.hero-date{font-size:11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<style>
nav{gap:clamp(12px,3vw,36px)}
section[id]{scroll-margin-top:12px}
.hero-venue{margin-top:12px}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{display:grid;grid-template-columns:95px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.timeline li:last-child{border-bottom:1px solid var(--line)}
.timeline time{font-weight:600;font-variant-numeric:tabular-nums}
.note{margin-top:18px;color:var(--muted)}
.rsvp{text-align:center;padding:68px 22px;background:var(--blue)}
.rsvp .button{opacity:.72}
.attire-title{text-align:center;padding:70px 22px;background:var(--blue)}
.attire-title a{display:inline-block;margin-top:20px}
.attire{max-width:1120px;margin:auto;padding:66px max(6vw,22px)}
.attire h2{font-size:clamp(38px,6vw,65px)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;list-style:none;padding:0;margin:25px 0 60px;text-align:center}
.swatches span{display:block;max-width:104px;aspect-ratio:1;margin:0 auto 10px;border:1px solid #243c4b22;border-radius:50%;background:var(--swatch)}
@media(max-width:550px){.swatches{grid-template-columns:repeat(2,1fr)}.swatches span{max-width:75px}}
</style>
<style>.dress-board{margin:0 0 28px;overflow:hidden;border-radius:5px}.dress-board img{width:100%;height:auto;display:block;margin-top:-8.5%}.attire #colour-title{margin-top:clamp(48px,8vw,84px)}</style>
<style>
@media screen and (prefers-reduced-motion:no-preference){
  .scroll-fade .fade-pending{
    opacity:0;
    transition:opacity 650ms cubic-bezier(.22,.61,.36,1);
  }
  .scroll-fade .fade-pending.fade-visible,
  .scroll-fade .fade-pending:focus-within{opacity:1}
}
</style>
</head>
<body><header id="top"><a class="mark" href="index.html" aria-label="C and K home">C &amp; K</a><nav aria-label="Wedding navigation"><a href="index.html#wedding">Details</a><a href="dress-code.html">Dress Inspo</a><a href="index.html#rsvp">RSVP</a></nav></header>
<main id="attire">
<section class="attire-title">
<h1 style="font-size:clamp(65px,11vw,120px)">Dress Inspo</h1>
<p>Dress code: Semi-formal to formal</p>
</section>
<section class="attire" aria-label="Outfit ideas and colours">
<figure class="dress-board"><img src="dress-inspiration.jpg" alt="Outfit mood board with dresses in yellow, blush, rose, peach, taupe and chocolate, and tailored looks in cream, brown and deep green."></figure>
<h2 id="colour-title">Colours to avoid</h2>
<p>Please avoid these four colours for your outfit.</p>
<ul class="swatches">
<li><span style="--swatch:#b9d2e3"></span>Light blue</li>
<li><span style="--swatch:#a4b09c"></span>Sage green</li>
<li><span style="--swatch:#fff"></span>White</li>
<li><span style="--swatch:#171717"></span>Black</li>
</ul>
</section>
</main><footer><strong>C &amp; K</strong><p>1 MAY 2027 · #COASTTOCRUSI</p></footer>
<script>
(() => {
  if (!('IntersectionObserver' in window)) return;

  const sections = document.querySelectorAll(
    '.hero-inner, .intro > *, .detail-grid > *, .rsvp > *, ' +
    '.attire-title > *, .attire > *, footer > *'
  );
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      entry.target.classList.add('fade-visible');
      observer.unobserve(entry.target);
    }
  }, {rootMargin: '0px 0px -5% 0px'});

  for (const section of sections) {
    section.classList.add('fade-pending');
    observer.observe(section);
  }
  document.documentElement.classList.add('scroll-fade');
})();
</script>
</body>
</html>
